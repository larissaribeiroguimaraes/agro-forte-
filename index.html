<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuro Sustentável em Equilíbrio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fundo com círculos flutuantes será criado via JS -->

  <div class="container">
    <h1>Futuro Sustentável em Equilíbrio</h1>
    <p>Digite a chave para desbloquear a visão do nosso planeta equilibrado:</p>
    <input type="text" id="chave" placeholder="Digite a chave">
    <br>
    <button id="btn-verificar">Desbloquear</button>

    <div id="mensagem"></div>

    <div id="conteudo-secreto">
      🌱 Imagine um futuro onde tecnologia e natureza coexistem em harmonia.<br>
      🌎 Energia limpa, cidades verdes e oceanos limpos.<br>
      🤝 Um mundo em equilíbrio, sustentável e próspero para todos.
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
